name: Enregistrer les voix (Gemini TTS)

on:
  # Niveau payant Gemini : le meilleur modèle est plafonné à 100 requêtes par jour (remise à zéro vers 08h UTC).
  # Ces passages terminent les enregistrements manquants, puis ne font plus rien (et ne coûtent plus rien).
  schedule:
    - cron: "20 8 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Limiter à une histoire (ex. filou_pirates) — vide = tout ce qui manque"
        default: ""
      voix:
        description: "Nom de la voix Gemini (vide = voix actuelle)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: gen-voix
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - run: pip install --quiet faster-whisper

      - name: Enregistrer les histoires manquantes (reprise automatique)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TITI_PAYANT: "1"
          TITI_TTS_ESPACE: "0"
          TITI_TTS_MODELES: gemini-3.8-flash-tts
          TITI_TTS_PAUSE: "1"
          ONLY: ${{ github.event.inputs.only }}
          VOIX: ${{ github.event.inputs.voix }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Secret GEMINI_API_KEY requis"; exit 1; fi
          python3 tools/gen_voix.py ${ONLY:+--only "$ONLY"} ${VOIX:+--voix "$VOIX"}

      - name: Committer les voix et republier le site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "titistoire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/voix/
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Voix : $(git diff --cached --name-only | grep -c m4a) piste(s)"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
            gh workflow run deploy.yml --ref main
          fi
