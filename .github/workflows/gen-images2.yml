name: Illustrations FLUX.2 avec références

on:
  push:
    branches: [main]
    paths: ['.github/gen-images2.run']
  workflow_dispatch:

permissions:
  contents: write
  actions: write


jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        lot: [filou_, nestor_, rosie_, plume_]     # avec « parallele=1 », un lot par héros en même temps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Générer (le fichier .github/gen-images2.run donne only=, modele=, sortie=)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ONLY=$(sed -n 's/^only=//p' .github/gen-images2.run | head -1)
          if grep -q '^parallele=1' .github/gen-images2.run; then ONLY="${{ matrix.lot }}"; elif [ "${{ matrix.lot }}" != "filou_" ]; then echo "lot unique : rien à faire ici"; exit 0; fi
          MODELE=$(sed -n 's/^modele=//p' .github/gen-images2.run | head -1)
          SORTIE=$(sed -n 's/^sortie=//p' .github/gen-images2.run | head -1)
          FICHES=$(sed -n 's/^fiches=//p' .github/gen-images2.run | head -1)
          TOUT=$(sed -n 's/^tout=//p' .github/gen-images2.run | head -1)
          PILOTE=$(sed -n 's/^pilote=//p' .github/gen-images2.run | head -1)
          if [ -n "$PILOTE" ]; then      # essai d'images d'un nouveau recueil : pilote=cometes/pilote.json
            if [ "${{ matrix.lot }}" = "filou_" ]; then python3 tools/pilote_images.py "$PILOTE"; fi
            exit 0
          fi
          COMPARER=$(sed -n 's/^comparer=//p' .github/gen-images2.run | head -1)
          if [ -n "$COMPARER" ]; then     # même histoire dessinée par plusieurs modèles : comparer=modele1,modele2
            for M in $(echo "$COMPARER" | tr ',' ' '); do python3 tools/gen_images2.py --only "$ONLY" --tout --modele "$M" --sortie "assets/essai-$(basename $M)" || true; done
            exit 0
          fi
          REFAIRE=$(sed -n 's/^refaire=//p' .github/gen-images2.run | head -1)
          python3 tools/gen_images2.py ${ONLY:+--only "$ONLY"} ${FICHES:+--fiches} ${TOUT:+--tout} ${REFAIRE:+--refaire "$REFAIRE"} ${MODELE:+--modele "$MODELE"} ${SORTIE:+--sortie "$SORTIE"}
      - name: Committer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "titistoire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ cometes/ galaxies/ 2>/dev/null || git add assets/
          if git diff --cached --quiet; then echo "Rien de nouveau."; else
            git commit -m "Illustrations FLUX.2 : $(git diff --cached --name-only | wc -l | tr -d ' ') fichier(s)"
            for i in 1 2 3 4 5 6; do git pull --rebase && git push && break || sleep $((RANDOM % 20 + 5)); done
            gh workflow run deploy.yml --ref main
          fi
