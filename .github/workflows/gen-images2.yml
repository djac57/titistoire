name: Illustrations FLUX.2 avec références (essai)

on:
  push:
    branches: [main]
    paths: ['.github/gen-images2.run']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gen-images2
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Générer (le fichier .github/gen-images2.run donne only=, modele=, sortie=)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ONLY=$(sed -n 's/^only=//p' .github/gen-images2.run | head -1)
          MODELE=$(sed -n 's/^modele=//p' .github/gen-images2.run | head -1)
          SORTIE=$(sed -n 's/^sortie=//p' .github/gen-images2.run | head -1)
          python3 tools/gen_images2.py --only "$ONLY" ${MODELE:+--modele "$MODELE"} ${SORTIE:+--sortie "$SORTIE"}
      - name: Committer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "titistoire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then echo "Rien de nouveau."; else
            git commit -m "Illustrations FLUX.2 : $(git diff --cached --name-only | wc -l | tr -d ' ') fichier(s)"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
            gh workflow run deploy.yml --ref main
          fi
