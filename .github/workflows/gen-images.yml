name: Générer les illustrations (FLUX)

on:
  schedule:
    # Le quota Cloudflare (10 000 neurons ≈ 100 images) repart à 00:00 UTC. GitHub lance les crons
    # avec parfois plusieurs heures de retard (le 11/11 : 09h27 UTC au lieu de 02h20, quota déjà
    # consommé -> 0 image). Donc 3 créneaux tôt : le 1er qui passe prend la ration du jour,
    # les suivants ne trouvent plus de quota et s'arrêtent en quelques secondes.
    - cron: "7 0 * * *"
    - cron: "37 1 * * *"
    - cron: "7 4 * * *"
  push:                       # lancement à la demande : modifier la date dans .github/gen-images.run
    branches: [main]
    paths: ['.github/gen-images.run']
  workflow_dispatch:
    inputs:
      only:
        description: "Limiter à une histoire (ex. filou_pirates) — vide = tout ce qui manque"
        default: ""
      refaire:
        description: "Images à regénérer (ex. filou_pirates_3,nestor_dino_1)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: gen-images
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Générer les illustrations manquantes (reprise automatique)
        env:
          TITI_IMG_SRC: cf
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          REFAIRE: ${{ github.event.inputs.refaire }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Secrets CF_ACCOUNT_ID + CF_API_TOKEN requis (Workers AI)"; exit 1
          fi
          # lancement par push : le fichier .github/gen-images.run peut contenir une ligne « only=histoire1,histoire2 »
          if [ -z "$ONLY" ] && [ -f .github/gen-images.run ]; then ONLY=$(sed -n 's/^only=//p' .github/gen-images.run | head -1); fi
          python3 tools/gen_images.py ${ONLY:+--only "$ONLY"} ${REFAIRE:+--refaire "$REFAIRE"}

      - name: Committer les images et republier le site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "titistoire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Illustrations : $(git diff --cached --name-only | wc -l | tr -d ' ') image(s)"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
            # un push fait par une Action ne déclenche pas le déploiement Pages : on le lance explicitement
            gh workflow run deploy.yml --ref main
          fi
