name: Générer les illustrations (HF FLUX)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all = régénère les 24 · missing = seulement les manquantes"
        default: "all"
        type: choice
        options: [all, missing]

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer les illustrations
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ] && [ -z "$HF_TOKEN" ]; then echo "::error::Ajoute les secrets CF_ACCOUNT_ID + CF_API_TOKEN (Workers AI), ou HF_TOKEN"; exit 1; fi
          python3 tools/gen_images.py "${{ github.event.inputs.mode }}"
      - name: Committer les images
        run: |
          git config user.name "titistoire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/
          git commit -m "Illustrations FLUX générées en CI (Hugging Face)" || echo "rien à committer"
          git push
