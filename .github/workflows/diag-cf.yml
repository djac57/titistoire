name: Diagnostic Cloudflare (modèles d'image disponibles)
on:
  push:
    branches: [main]
    paths: ['.github/diag-cf.run']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Lister les modèles texte-vers-image du compte
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          for q in flux image stable lucid phoenix; do
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/models/search?search=$q&per_page=50" -H "Authorization: Bearer $CF_API_TOKEN" \
              | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for m in d.get('result',[]):
              t=(m.get('task') or {}).get('name','')
              if 'mage' in t: print('MODELE', m['name'], '|', t, '|', (m.get('description') or '')[:110].replace('\n',' '), '|', [p.get('property_id')+'='+str(p.get('value'))[:60] for p in m.get('properties',[]) if p.get('property_id') in ('price','beta','terms')])
          print('  (recherche', sys.argv[1], ':', len(d.get('result',[])), 'résultats,', d.get('errors'), ')')" "$q"
          done
