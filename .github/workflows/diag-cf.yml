name: Diagnostic Cloudflare (modèles disponibles)
on:
  push:
    branches: [main]
    paths: ['.github/diag-cf.run']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Lister les modèles du compte, par tâche
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          for p in 1 2 3; do
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/models/search?per_page=100&page=$p" -H "Authorization: Bearer $CF_API_TOKEN" > m$p.json
          done
          python3 - <<'PY'
          import json,glob
          vus=set()
          for f in sorted(glob.glob("m*.json")):
              for m in json.load(open(f)).get("result",[]):
                  if m["name"] in vus: continue
                  vus.add(m["name"]); t=(m.get("task") or {}).get("name","")
                  pr=[str(p.get("value"))[:150] for p in m.get("properties",[]) if p.get("property_id")=="price"]
                  print("MODELE |",t,"|",m["name"],"|",(m.get("description") or "")[:90].replace("\n"," "),"|",pr)
          print("TOTAL",len(vus))
          PY
