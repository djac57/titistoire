name: Déployer le worker (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déployer le worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
      - name: (Re)poser les secrets APRÈS le deploy (sinon deploy les efface)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          secrets: |
            GEMINI_KEY
            ELEVEN_KEY
            OPENROUTER_KEY
            LIBRE_PASS
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_KEY: ${{ secrets.ELEVEN_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          LIBRE_PASS: ${{ secrets.LIBRE_PASS }}
