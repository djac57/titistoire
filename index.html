<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d2570">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Titistoire">
<title>Titistoire — Mon Petit Conteur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%232d2570'/><path d='M32 20c-5-3-12-3-17-2v26c5-1 12-1 17 2 5-3 12-3 17-2V18c-5-1-12-1-17 2z' fill='none' stroke='%23ffcb4d' stroke-width='3.6' stroke-linejoin='round'/><path d='M32 20v26' stroke='%23ffcb4d' stroke-width='3.6'/><path d='M47 9l1.6 3.4 3.7.5-2.7 2.6.6 3.7-3.2-1.7-3.2 1.7.6-3.7-2.7-2.6 3.7-.5z' fill='%23ffd86b'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%232d2570'/><path d='M32 20c-5-3-12-3-17-2v26c5-1 12-1 17 2 5-3 12-3 17-2V18c-5-1-12-1-17 2z' fill='none' stroke='%23ffcb4d' stroke-width='3.6' stroke-linejoin='round'/><path d='M32 20v26' stroke='%23ffcb4d' stroke-width='3.6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font-d:'Fredoka',ui-rounded,system-ui,sans-serif;
    --font-t:'Nunito',ui-rounded,system-ui,sans-serif;
    /* habillage par défaut : nuit étoilée */
    --bg1:#3b2f86; --bg2:#2d2570; --bg3:#241e5c; --halo1:#6a4fd0; --halo2:#3b61c4;
    --ink:#f3f1ff; --ink2:#b9b1e4;
    --gold:#ffcb4d; --gold-d:#f0b42e; --pur:#8f7cf5; --pur-d:#7161e6; --go:#35cf9f; --go-d:#27b488;
    --paper:#fdfaf3; --paper-ink:#3a3160; --paper-ink2:#8b82ab; --paper-line:rgba(60,48,110,.12);
    --card:rgba(255,255,255,.07); --card-bd:rgba(255,255,255,.16);
    --hi:#ffd86b; --hi-ink:#5a4100;
    --sh-sm:0 4px 16px rgba(8,5,35,.32); --sh:0 16px 40px rgba(8,5,35,.42); --sh-lg:0 24px 56px rgba(8,5,35,.5);
    --radius:20px;
  }
  /* MODE JOUR : ciel clair et nuages (le mode nuit, étoilé, reste celui par défaut le soir) */
  :root[data-mode="jour"]{ --bg1:#bfe6ff; --bg2:#9fd4fa; --bg3:#84c1f1; --halo1:#fff3c4; --halo2:#ffffff;
    --ink:#2b2a5c; --ink2:#4a5788; --gold:#f08a1c; --gold-d:#d97706;
    --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.95);
    --sh-sm:0 4px 14px rgba(40,80,140,.16); --sh:0 14px 34px rgba(40,80,140,.2); --sh-lg:0 22px 50px rgba(40,80,140,.26); }
  /* en saison : seule la couleur des halos change (le fond reste nuit étoilée ou ciel de jour) */
  :root[data-saison="noel"]{ --halo1:#d8473b; --halo2:#2e9b78; }
  :root[data-saison="halloween"]{ --halo1:#ff8a2b; --halo2:#9a4fd0; }
  :root[data-saison="ski"]{ --halo1:#9fd3ff; --halo2:#ffffff; }
  :root[data-saison="mer"]{ --halo1:#ffd166; --halo2:#27c4c4; }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* le fond est porté par <html> : les étoiles et halos (z-index négatif) restent ainsi visibles par-dessus */
  html{background:radial-gradient(130% 90% at 50% -10%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%) fixed var(--bg3);}
  html,body{height:100%;}
  body{ margin:0; color:var(--ink); font-family:var(--font-t); font-weight:600;
    background:transparent;
    min-height:100%; position:relative; overflow-x:hidden; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(100px);opacity:.3;z-index:-2;pointer-events:none;}
  body::before{width:380px;height:380px;background:var(--halo1);top:-130px;left:-100px;}
  body::after{width:420px;height:420px;background:var(--halo2);bottom:-150px;right:-110px;}
  .stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  .stars b{position:absolute;color:#fff;opacity:.55;font-size:10px;font-weight:400;animation:tw 4.5s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.18;transform:scale(.7)}50%{opacity:.8;transform:scale(1.05)}}
  .stars b.fall{animation:fall linear infinite;opacity:.7;top:-5%;}
  @keyframes fall{to{transform:translateY(112vh) translateX(24px) rotate(160deg)}}
  .stars b.rise{animation:rise linear infinite;opacity:.35;bottom:-5%;top:auto;}
  .stars b.drift{animation:drift ease-in-out infinite alternate;opacity:.9;line-height:1;}
  @keyframes drift{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
  :root[data-mode="jour"] .stars b.fall{color:#fff;opacity:.95;text-shadow:0 0 3px rgba(60,110,170,.55);}
  :root[data-mode="jour"] h1{text-shadow:0 2px 0 rgba(255,255,255,.7);}
  :root[data-mode="jour"] .thumb{background:rgba(255,255,255,.4);}
  .modebtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--card-bd);background:var(--card);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .modebtn svg{width:24px;height:24px;}
  @keyframes rise{to{transform:translateY(-112vh) translateX(-18px)}}
  @media (prefers-reduced-motion:reduce){.stars b{animation:none!important;}}

  h1,h2,h3,.q,.btn,.lab,.title,.counter,.back,.arrow{font-family:var(--font-d);letter-spacing:.3px;}
  header{text-align:center;margin:6px 0 20px;}
  h1{font-size:clamp(2rem,7.5vw,2.8rem);margin:.1em 0;font-weight:700;color:var(--gold);text-shadow:0 2px 18px rgba(255,203,77,.3);}
  .sub{color:var(--ink2);margin:6px 0 0;font-size:clamp(.92rem,3.3vw,1.05rem);font-weight:600;}
  .wrap{width:100%;max-width:720px;}
  .wrap.wide{max-width:1000px;}
  .screen{display:none;animation:pop .45s cubic-bezier(.2,.7,.3,1);}
  .screen.show{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .q{text-align:center;font-size:clamp(1.3rem,4.8vw,1.7rem);font-weight:600;margin:4px 0 20px;color:var(--ink);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--radius);box-shadow:var(--sh-sm);cursor:pointer;overflow:hidden;position:relative;
    transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s;font-family:inherit;color:var(--ink);padding:0;text-align:center;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;}
  .card:active{transform:scale(.96);}
  @media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:rgba(255,255,255,.45);}}
  .thumb{width:100%;aspect-ratio:4/3;display:block;position:relative;overflow:hidden;background:rgba(0,0,0,.18);}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2.2rem,10vw,3.2rem);}
  .card .icon{display:flex;justify-content:center;align-items:center;padding:20px 0 2px;color:var(--gold);}
  .card .icon svg{width:clamp(42px,12vw,56px);height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.2));}
  .card .lab{display:block;padding:10px 8px 3px;font-size:clamp(1rem,3.8vw,1.15rem);font-weight:600;color:var(--ink);}
  .card .lab:last-child{padding-bottom:14px;}
  .card .sm{display:block;padding:0 10px 13px;font-size:clamp(.78rem,2.9vw,.9rem);color:var(--ink2);font-weight:600;line-height:1.3;}
  .badge{position:absolute;top:8px;right:8px;z-index:2;background:var(--gold);color:#3a2a00;font-family:var(--font-d);font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;box-shadow:var(--sh-sm);}
  .heard{position:absolute;top:8px;left:8px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--go-d);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;box-shadow:var(--sh-sm);}
  .back{display:inline-flex;align-items:center;gap:6px;background:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:.95rem;font-weight:600;color:var(--paper-ink);box-shadow:var(--sh-sm);cursor:pointer;margin-bottom:16px;transition:transform .12s;}
  .back:active{transform:scale(.95);}

  /* section de saison (accueil) */
  .season{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);border-radius:26px;padding:18px 16px 16px;margin-bottom:24px;box-shadow:var(--sh);}
  .season h2{margin:0 0 4px;text-align:center;font-size:clamp(1.35rem,5.4vw,1.9rem);font-weight:700;color:var(--gold);}
  .season p{margin:0 0 14px;text-align:center;color:var(--ink2);font-size:.95rem;}
  .season .card .lab{font-size:clamp(.92rem,3.5vw,1.05rem);line-height:1.25;}
  .sep{text-align:center;color:var(--ink2);font-family:var(--font-d);font-weight:500;font-size:1rem;margin:0 0 12px;}

  /* choix par sujet */
  .fam{margin:0 0 22px;}
  .fam h3{font-size:1.1rem;font-weight:600;color:var(--gold);margin:0 0 10px 4px;}
  .subj{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;width:100%;text-align:left;padding:9px 12px;margin-bottom:9px;}
  .subj .av{flex:0 0 46px;width:46px;height:46px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.35);}
  .subj .av img{width:100%;height:100%;object-fit:cover;display:block;}
  .subj b{display:block;font-family:var(--font-d);font-weight:600;font-size:1.05rem;color:var(--ink);}
  .subj small{display:block;color:var(--ink2);font-size:.85rem;font-weight:600;margin-top:1px;}
  .subj .ok{margin-left:auto;color:var(--go);font-weight:800;}

  /* mode libre */
  .freeform{display:flex;flex-direction:column;gap:16px;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--radius);padding:22px;box-shadow:var(--sh);}
  .groupes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px;}
  .groupes button{font-family:inherit;border:1.5px solid transparent;border-radius:16px;padding:9px 4px 8px;background:rgba(255,255,255,.10);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;}
  .groupes button svg{width:30px;height:30px;}
  .groupes button b{font-size:.86rem;font-weight:800;}
  .groupes button small{font-size:.72rem;opacity:.8;font-weight:600;}
  .groupes button.on{background:rgba(255,203,77,.20);border-color:#ffcb4d;}
  .groupes button:disabled{opacity:.5;cursor:default;}
  .freeform label{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:1.02rem;color:var(--ink);}
  .freeform input,.freeform select{font-family:inherit;font-weight:600;font-size:1.05rem;padding:13px 15px;border-radius:14px;border:1.5px solid transparent;background:#fff;color:var(--paper-ink);transition:box-shadow .15s;}
  .freeform input:focus,.freeform select:focus{outline:none;box-shadow:0 0 0 4px rgba(255,203,77,.4);}
  .genstatus{text-align:center;color:var(--ink2);min-height:1.3em;font-weight:700;}
  #libreForm{display:flex;flex-direction:column;gap:16px;}
  #libreLock{display:flex;flex-direction:column;}
  #libreForm[hidden],#libreLock[hidden]{display:none;}
  .genbar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;}
  .genbar[hidden]{display:none;}
  .genbar span{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--pur));transition:width .25s ease;}

  /* LIVRE = papier ivoire */
  .book{background:var(--paper);color:var(--paper-ink);border-radius:26px;box-shadow:var(--sh-lg);padding:16px 16px 20px;position:relative;}
  .title{text-align:center;font-size:clamp(1.2rem,4.6vw,1.6rem);font-weight:600;margin:4px 0 14px;color:var(--paper-ink);line-height:1.2;}
  .spread{display:block;}
  .frame{position:relative;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(60,48,110,.08);aspect-ratio:1/1;max-height:46vh;margin:0 auto;background:#ece7fb;}
  .frame.turning{animation:flip .55s cubic-bezier(.4,0,.3,1);}
  @keyframes flip{0%{transform:scale(1)}50%{transform:scale(.965);opacity:.9}100%{transform:scale(1);opacity:1}}
  .frame img,.frame svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .frame .scene-img{animation:fadein .5s ease;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .hero-emo{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:clamp(3rem,16vw,5rem);filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
  .side{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .ptext{padding:18px 8px 4px;font-size:clamp(1.22rem,4.5vw,1.5rem);line-height:1.7;text-align:center;min-height:5.2em;font-weight:600;color:var(--paper-ink);display:flex;align-items:center;justify-content:center;}
  .ptext>div{animation:fadein .35s ease;}
  .word{padding:1px 2px;border-radius:7px;transition:background .12s,color .12s;}
  .word.on{background:var(--hi);color:var(--hi-ink);}
  .fin{text-align:center;padding:18px 8px 6px;}
  .fin h3{font-size:clamp(1.6rem,6vw,2.1rem);margin:0 0 6px;color:var(--pur-d);font-weight:700;}
  .fin p{margin:0 0 4px;color:var(--paper-ink2);}

  .pagenav{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 2px;}
  .arrow{border:1px solid var(--paper-line);background:#fff;border-radius:50%;width:46px;height:46px;font-size:1.1rem;box-shadow:var(--sh-sm);cursor:pointer;color:var(--paper-ink);transition:transform .12s;}
  .arrow:active{transform:scale(.9);} .arrow:disabled{opacity:.3;box-shadow:none;}
  .dots{display:flex;gap:6px;align-items:center;justify-content:center;min-width:120px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(60,48,110,.16);transition:background .2s,transform .2s;}
  .dots i.on{background:var(--pur);transform:scale(1.35);} .dots i.done{background:rgba(113,97,230,.45);}
  .counter{font-weight:600;color:var(--paper-ink2);text-align:center;font-size:.9rem;min-width:92px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;}
  .btn{border:none;border-radius:999px;padding:11px 20px;font-size:1rem;font-weight:600;font-family:var(--font-d);color:#fff;cursor:pointer;box-shadow:var(--sh-sm);display:inline-flex;align-items:center;gap:7px;transition:transform .14s,filter .14s;}
  .btn:active{transform:scale(.94);}
  @media(hover:hover){.btn:hover{filter:brightness(1.05);}}
  .btn.play{background:linear-gradient(135deg,var(--go),var(--go-d));font-size:1.12rem;padding:13px 30px;}
  .btn.play.pause{background:linear-gradient(135deg,#8f7cf5,#7161e6);}
  .btn.sec{background:#fff;color:var(--paper-ink);border:1px solid var(--paper-line);}
  .btn.home{background:linear-gradient(135deg,#8f7cf5,#7161e6);}
  details.settings{margin-top:16px;text-align:center;color:var(--paper-ink2);font-weight:700;font-size:.92rem;}
  details.settings summary{cursor:pointer;list-style:none;display:inline-block;padding:6px 12px;border-radius:999px;}
  details.settings summary::-webkit-details-marker{display:none;}
  .setrow{display:flex;gap:12px 18px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px;background:rgba(60,48,110,.05);border:1px solid var(--paper-line);border-radius:16px;padding:10px 14px;font-size:1.02rem;}
  .setrow input[type=range]{accent-color:#8f7cf5;height:6px;vertical-align:middle;}
  .setrow select{font-family:var(--font-t);font-weight:700;color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:10px;padding:6px 10px;background:#fff;cursor:pointer;max-width:48vw;}
  .saved-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .saved-del{width:46px;height:46px;font-size:1rem;flex:0 0 auto;background:#fff;color:var(--paper-ink);}
  .saved-open{flex:1;}

  /* grand écran : le livre s'ouvre en double page */
  @media (min-width:860px){
    .grid.g4{grid-template-columns:repeat(4,1fr);} .grid.g3{grid-template-columns:repeat(3,1fr);} .grid.g5{grid-template-columns:repeat(5,1fr);}
    .book{padding:24px 26px 24px;}
    .spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;}
    .frame{max-height:none;width:100%;}
    .ptext{font-size:1.5rem;min-height:8em;padding:0 6px;}
    .fams{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;}
  }
  @media (max-width:430px){
    h1{font-size:2rem;} .q{font-size:1.3rem;margin-bottom:16px;} .grid{gap:11px;}
    .book{padding:12px 12px 16px;border-radius:22px;} .ptext{font-size:1.24rem;padding:14px 4px 2px;}
    .controls{gap:8px;} .btn{padding:11px 17px;}
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<button class="modebtn" id="modeBtn" aria-label="Mode jour ou nuit"></button>
<header>
  <h1>Titistoire</h1>
  <p class="sub" id="sub">De belles histoires à écouter et à regarder</p>
</header>

<div class="wrap" id="wrap">
  <!-- accueil -->
  <section class="screen" id="s0">
    <div class="groupes" id="groupes" role="tablist" aria-label="Âge de l'enfant"></div>
    <div class="season" id="season" hidden>
      <h2 id="seasonTitle"></h2>
      <p id="seasonSub"></p>
      <div class="grid g4" id="seasonGrid"></div>
    </div>
    <p class="sep" id="sepAll" hidden>Toutes les histoires</p>
    <div class="grid g4">
      <button class="card" id="modeHero"><div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5.5l5.4 11 12.1 1.8-8.8 8.5 2.1 12.1L24 33.2l-10.8 5.7 2.1-12.1-8.8-8.5 12.1-1.8z" fill="currentColor" fill-opacity=".18"/><circle cx="20" cy="22.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="28" cy="22.5" r="1.5" fill="currentColor" stroke="none"/><path d="M20.5 27.5c2 2 5 2 7 0"/></svg></div><span class="lab">Choisir un héros</span></button>
      <button class="card" id="modeSubject"><div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40S8 30 8 19a8 8 0 0116-3 8 8 0 0116 3c0 11-16 21-16 21z"/></svg></div><span class="lab">Choisir un sujet</span></button>
      <button class="card" id="modeRandom"><div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="30" height="30" rx="7"/><circle cx="17" cy="17" r="2" fill="currentColor" stroke="none"/><circle cx="31" cy="17" r="2" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="2" fill="currentColor" stroke="none"/><circle cx="17" cy="31" r="2" fill="currentColor" stroke="none"/><circle cx="31" cy="31" r="2" fill="currentColor" stroke="none"/></svg></div><span class="lab">Surprise !</span></button>
      <button class="card" id="modeFree"><div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 33L33 15"/><path d="M31 11l1.6 3.4L36 16l-3.4 1.6L31 21l-1.6-3.4L26 16l3.4-1.6z" fill="currentColor" stroke="none"/><circle cx="13" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="36" cy="31" r="1.4" fill="currentColor" stroke="none"/></svg></div><span class="lab">J'invente la mienne</span></button>
    </div>
    <button class="card" id="modeSaved" style="width:100%;margin-top:14px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;padding:14px"><span class="icon" style="padding:0"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:30px"><path d="M24 13c-4-2.6-10-2.6-14-1.6v24c4-1 10-1 14 1.6 4-2.6 10-2.6 14-1.6v-24c-4-1-10-1-14 1.6z"/><path d="M24 13v24"/></svg></span><span class="lab" style="padding:0">Mes histoires inventées</span></button>
  </section>

  <section class="screen" id="s2"><button class="back" data-go="s1">← Retour</button><h2 class="q" id="q2">Où part-on ?</h2><div class="grid g5" id="grid2"></div></section>
  <section class="screen" id="sSubj"><button class="back" data-go="s0">← Retour</button><h2 class="q">Une histoire pour parler de…</h2><div class="fams" id="fams"></div></section>

        <input id="librePass" type="password" placeholder="mot de passe" style="width:100%">
        <button class="btn play" id="libreUnlock" style="align-self:center;margin-top:14px">Déverrouiller</button>

      <div id="libreForm" hidden>
        <label>Le héros<input id="fHero" placeholder="ex : un petit lapin bleu nommé Pompon"></label>
        <label>Le lieu<input id="fLieu" placeholder="ex : une forêt enchantée sous la pluie"></label>
        <label>De quoi ça parle ?<input id="fLecon" placeholder="ex : apprendre à attendre son tour"></label>
        <label>Pour quel âge ?<select id="fAge"><option value="petit">Lucioles, 1-3 ans — toute simple</option><option value="moyen" selected>Étoiles, 3-6 ans — une vraie aventure</option><option value="grand">Comètes, 6-8 ans — plus longue, langue soutenue</option></select></label>
        <button class="btn play" id="genBtn" style="align-self:center">Invente l'histoire</button>

            <span class="dots" id="dots"></span><span class="counter" id="counter" hidden></span>

          <span id="voiceWrap">voix <select id="voiceSel"></select></span>

<script src="stories.js?v=1"></script>
<script>
/* ===== Worker IA (voix de secours + images et histoires du mode libre) ===== */
const AIW = "https://titistoire-ai.djac-gene.workers.dev";
const STORIES = window.TITI_STORIES || {};

/* ===== DONNÉES ===== */
const PERSOS=[
  {id:'filou',nom:'Filou',emoji:'🦊',trait:"Malin, farceur… et un peu vantard"},
  {id:'nestor',nom:'Nestor',emoji:'🐻',trait:"Grand, doux et très gourmand"},
  {id:'rosie',nom:'Rosie',emoji:'🐰',trait:"Rapide, décidée, toujours la première"},
  {id:'plume',nom:'Plume',emoji:'🦉',trait:"Rêveuse, curieuse, mille questions"},
];
const UNIVERS=[
  {id:'pirates',nom:'Les pirates',emoji:'🏴‍☠️',g:['#ffd59e','#6fb9e0']},
  {id:'dino',nom:'Les dinosaures',emoji:'🦕',g:['#cdefff','#bfe3a0']},
  {id:'chevaliers',nom:'Le château',emoji:'🏰',g:['#ffe3c2','#b79cff']},
  {id:'espace',nom:"L'espace",emoji:'🚀',g:['#2a1b5e','#5b2a82']},
  {id:'foret',nom:'La forêt',emoji:'🌲',g:['#bfe9ff','#bfe8c6']},
  {id:'ocean',nom:"L'océan",emoji:'🐠',g:['#8fd3ff','#1f6bb0']},
  {id:'noel',nom:'Noël',emoji:'🎄',saison:1,g:['#24476b','#e9f3ff']},
  {id:'halloween',nom:'Halloween',emoji:'🎃',saison:1,g:['#3a1d4d','#ff9a3c']},
  {id:'ski',nom:'Au ski',emoji:'⛷️',saison:1,g:['#9fd3ff','#ffffff']},
  {id:'mer',nom:'À la plage',emoji:'🏖️',saison:1,g:['#8fe0ef','#ffe6a8']},
];
const FAMILLES=[['oser','Oser'],['coeur','Le cœur'],['autres','Avec les autres'],['grandir','Grandir']];
const SAISONS={
  noel:{titre:"C'est bientôt Noël !",sub:"Quatre histoires à écouter bien au chaud",deco:['❄','fall',26]},
  halloween:{titre:"C'est Halloween !",sub:"Quatre histoires qui font (un tout petit peu) peur",deco:['✦','tw',22]},
  ski:{titre:"Vive les vacances à la neige !",sub:"Quatre histoires à dévaler en luge",deco:['❄','fall',26]},
  mer:{titre:"C'est l'été, tous à la plage !",sub:"Quatre histoires les pieds dans le sable",deco:['●','rise',18]},
};
function saisonDuJour(){
  const q=new URLSearchParams(location.search).get('saison');
  if(q) return SAISONS[q]?q:null;                               // ?saison=noel pour prévisualiser, ?saison=aucune pour couper
  const d=new Date(), md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1201||md<=105) return 'noel';
  if(md>=115&&md<=315) return 'ski';
  if(md>=625&&md<=905) return 'mer';
  if(md>=1010&&md<=1103) return 'halloween';
  return null;
}
const SAISON=saisonDuJour();
const byId=(a,id)=>a.find(x=>x.id===id);
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===== décor de fond : MODE NUIT (étoiles, « histoire du soir ») ou MODE JOUR (ciel et nuages) =====
   Sans choix de l'utilisateur : nuit de 18 h à 7 h, jour sinon. En saison, flocons ou bulles s'ajoutent au décor. */
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3L7 7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';
function modeChoisi(){ let m=''; try{m=localStorage.getItem('titi_mode')||'';}catch(e){} if(m==='jour'||m==='nuit') return m;
  const h=new Date().getHours(); return (h>=18||h<7)?'nuit':'jour'; }
function decor(){
  const mode=modeChoisi(), R=Math.random; document.documentElement.dataset.mode=mode;
  if(SAISON) document.documentElement.dataset.saison=SAISON;
  let h='';
  if(mode==='nuit') for(let i=0;i<26;i++) h+=`<b style="left:${(R()*100).toFixed(1)}%;top:${(R()*100).toFixed(1)}%;font-size:${(8+R()*7).toFixed(0)}px;animation-delay:${(R()*5).toFixed(1)}s">✦</b>`;
  else for(let i=0;i<6;i++) h+=`<b class="drift" style="left:${(i*17+R()*8-6).toFixed(0)}%;top:${(3+R()*80).toFixed(0)}%;font-size:${(54+R()*64).toFixed(0)}px;animation-duration:${(14+R()*14).toFixed(0)}s;animation-delay:-${(R()*20).toFixed(0)}s">☁</b>`;
  if(SAISON){ const [glyph,anim,n]=SAISONS[SAISON].deco;
    if(anim!=='tw') for(let i=0;i<n;i++) h+=`<b class="${anim}" style="left:${(R()*100).toFixed(1)}%;font-size:${(8+R()*10).toFixed(0)}px;animation-duration:${(9+R()*10).toFixed(1)}s;animation-delay:-${(R()*18).toFixed(1)}s">${glyph}</b>`; }
  $('stars').innerHTML=h;
  document.querySelector('meta[name=theme-color]').content=mode==='nuit'?'#2d2570':'#9fd4fa';
  const b=$('modeBtn'); b.innerHTML=mode==='nuit'?ICON_SUN:ICON_MOON; b.title=mode==='nuit'?'Passer en mode jour':'Passer en mode nuit';
}
$('modeBtn').addEventListener('click',()=>{ try{localStorage.setItem('titi_mode',modeChoisi()==='nuit'?'jour':'nuit');}catch(e){} decor(); });
decor();

/* ===== histoires écoutées (petite coche sur les vignettes) ===== */
function heardAll(){ try{return JSON.parse(localStorage.getItem('titi_heard')||'[]');}catch(e){return [];} }
function markHeard(id){ if(!id) return; const a=heardAll(); if(!a.includes(id)){ a.push(id); try{localStorage.setItem('titi_heard',JSON.stringify(a));}catch(e){} } }

/* ===== vignettes : illustration du 1er tableau, sinon ambiance, sinon décor, sinon dégradé ===== */
function coverSources(sid){ const [h,u]=sid.split('_'); return [`assets/scenes/${sid}_1.jpg`,`assets/${h}_${u}.png`,`assets/decor_${u}.jpg`]; }
function thumbHTML(srcs,emoji,g){
  const bg=g?`style="background:linear-gradient(180deg,${g[0]},${g[1]})"`:'';
  return `<span class="thumb" ${bg}><span class="emo">${emoji||''}</span><img alt="" data-srcs="${esc(srcs.join('|'))}"></span>`;
}
function armThumbs(root){ root.querySelectorAll('img[data-srcs]').forEach(img=>{ const s=img.dataset.srcs.split('|'); let i=0;
  img.style.opacity=0; img.onload=()=>{img.style.opacity=1;}; img.onerror=()=>{ i++; if(i<s.length) img.src=s[i]; else img.remove(); }; img.src=s[0]; }); }
function storyCard(sid,opts){ opts=opts||{}; const st=STORIES[sid], [h,u]=sid.split('_'), U=byId(UNIVERS,u), P=byId(PERSOS,h);
  const b=document.createElement('button'); b.className='card';
  b.innerHTML=(heardAll().includes(sid)?'<span class="heard">✓</span>':'')+(opts.badge?`<span class="badge">${opts.badge}</span>`:'')
    +thumbHTML(coverSources(sid),P.emoji,U.g)+`<span class="lab">${esc(opts.lab||st.t)}</span>`+(opts.sm?`<span class="sm">${esc(opts.sm)}</span>`:'');
  b.addEventListener('click',()=>openStory(sid)); return b; }

/* ===== NAV ===== */
function goto(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id));
  $('wrap').classList.toggle('wide',id==='s4'||id==='s0'||id==='s1'||id==='s2'||id==='sSubj'); window.scrollTo({top:0,behavior:'smooth'}); stopAudio(); }
document.querySelectorAll('.back[data-go]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.go)));

/* une histoire de saison n'est proposée que pendant sa période */
function enSaison(sid){ const u=byId(UNIVERS,sid.split('_')[1]); return !u.saison||u.id===SAISON; }
/* ===== GROUPES D'ÂGE : Lucioles (1-3), Étoiles (3-6) ; Comètes (6-8) et Galaxies (8-10) à venir ===== */
const ICO=p=>`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const GROUPES=[
  ["lucioles","Lucioles","1-3 ans",ICO('<ellipse cx="24" cy="29" rx="8" ry="10"/><path d="M17 22c-7-2-10-8-7-12 4-2 9 2 10 9M31 22c7-2 10-8 7-12-4-2-9 2-10 9"/><path d="M21 29c1.5 2 4.500 2 6 0M24 6v3M14 40l-2 3M34 40l2 3M24 42v3"/>')],
  ["etoiles","Étoiles","3-6 ans",ICO('<path d="M24 6l5.200 11.200 12.300 1.500-9.100 8.400 2.500 12.100L24 33.200l-10.900 6 2.500-12.100-9.100-8.400 12.300-1.500z"/><path d="M20.500 25c1.500 2.200 5.500 2.200 7 0"/>')],
  ["cometes","Comètes","6-8 ans",ICO('<circle cx="31" cy="17" r="8"/><path d="M24 22L7 39M27 26L14 42M21 18L6 29"/>'),true],
  ["galaxies","Galaxies","8-10 ans",ICO('<path d="M24 24c0-3 3-5 6-4 4 1 6 6 4 10-3 6-11 8-17 4-7-5-8-15-2-21 7-7 19-7 26 0"/><circle cx="24" cy="24" r="1.600"/><path d="M40 34l.100 0M8 38l.100 0M38 8l.100 0"/>'),true]];
function groupe(){ try{ const g=localStorage.getItem('titi_groupe'); if(g==='lucioles'&&Object.values(STORIES).some(x=>x.p)) return g; }catch(e){} return 'etoiles'; }
function renderGroupes(){ const box=$('groupes'); if(!box) return; box.innerHTML=''; const g0=groupe(), aLucioles=Object.values(STORIES).some(x=>x.p);
  GROUPES.forEach(([id,nom,age,ico,bientot])=>{ const b=document.createElement('button'); const off=bientot||(id==='lucioles'&&!aLucioles);
    b.className=id===g0?'on':''; b.disabled=!!off; b.setAttribute('role','tab'); b.setAttribute('aria-selected',id===g0?'true':'false');
    b.innerHTML=ico+`<b>${nom}</b><small>${off?'bientôt':age}</small>`;
    b.addEventListener('click',()=>{ try{localStorage.setItem('titi_groupe',id);}catch(e){} renderGroupes(); });
    box.appendChild(b); });
  const fa=$('fAge'); if(fa&&!fa.dataset.choisi) fa.value=g0==='lucioles'?'petit':'moyen'; }
function renderHome(){ renderGroupes();
  const box=$('season');
  if(SAISON){ const S=SAISONS[SAISON], g=$('seasonGrid'); g.innerHTML='';
    $('seasonTitle').textContent=S.titre; $('seasonSub').textContent=S.sub;
    PERSOS.forEach(p=>{ const sid=p.id+'_'+SAISON; if(STORIES[sid]) g.appendChild(storyCard(sid)); });
    armThumbs(g); box.hidden=false; $('sepAll').hidden=false; }
  else { box.hidden=true; $('sepAll').hidden=true; }
}
function renderHeroes(){ const g=$('grid1'); g.innerHTML='';
  PERSOS.forEach(p=>{ const b=document.createElement('button'); b.className='card';
    b.innerHTML=thumbHTML([`assets/${p.id}_foret.png`],p.emoji,['#bfe9ff','#bfe8c6'])+`<span class="lab">${p.nom}</span><span class="sm">${p.trait}</span>`;
    b.addEventListener('click',()=>{ renderPlaces(p); goto('s2'); }); g.appendChild(b); });
  armThumbs(g); }
function renderPlaces(p){ const g=$('grid2'); g.innerHTML=''; $('q2').textContent=`Où part ${p.nom} ?`;
  const us=UNIVERS.slice().sort((a,b)=>((b.id===SAISON)-(a.id===SAISON)));     // la saison en cours passe en premier
  us.forEach(u=>{ const sid=p.id+'_'+u.id; if(!STORIES[sid]||!enSaison(sid)) return;
    g.appendChild(storyCard(sid,{lab:u.nom,sm:STORIES[sid].t,badge:u.id===SAISON?'de saison':''})); });
  armThumbs(g); }
function renderSubjects(){ const root=$('fams'); root.innerHTML=''; const heard=heardAll();
  FAMILLES.forEach(([fid,fnom])=>{ const box=document.createElement('div'); box.className='fam'; box.innerHTML=`<h3>${fnom}</h3>`;
    Object.keys(STORIES).filter(sid=>STORIES[sid].f===fid&&enSaison(sid)).sort((a,b)=>STORIES[a].s.localeCompare(STORIES[b].s,'fr')).forEach(sid=>{
      const st=STORIES[sid], h=sid.split('_')[0], b=document.createElement('button'); b.className='card subj';
      b.innerHTML=`<span class="av"><img alt="" src="assets/${h}_foret.png" onerror="this.remove()"></span><span><b>${esc(st.s)}</b><small>${esc(st.t)}</small></span>`+(heard.includes(sid)?'<span class="ok">✓</span>':'');
      b.addEventListener('click',()=>openStory(sid)); box.appendChild(b); });
    root.appendChild(box); }); }
$('modeHero').addEventListener('click',()=>{ renderHeroes(); goto('s1'); });
$('modeSubject').addEventListener('click',()=>{ renderSubjects(); goto('sSubj'); });
$('modeRandom').addEventListener('click',()=>{ const all=Object.keys(STORIES), heard=heardAll(); let pool=all.filter(s=>!heard.includes(s)); if(!pool.length) pool=all;
  pool=pool.filter(enSaison); if(!pool.length) pool=all.filter(enSaison);
  openStory(pool[Math.floor(Math.random()*pool.length)]); });
$('modeSaved').addEventListener('click',()=>{ renderSaved(); goto('sSaved'); });

/* ===== verrou du mode libre ===== */
function librePass(){ try{return localStorage.getItem('titi_libre_pass')||'';}catch(e){return '';} }
function showLibreGate(){ const unl=!!librePass(); const lk=$('libreLock'), fm=$('libreForm');
  lk.hidden=unl; lk.style.display=unl?'none':'flex'; fm.hidden=!unl; fm.style.display=unl?'flex':'none';
  if(!unl) $('lockMsg').textContent=''; }
$('modeFree').addEventListener('click',()=>{ showLibreGate(); goto('sFree'); });
async function doUnlock(){
  const v=$('librePass').value.trim(), lm=$('lockMsg'), btn=$('libreUnlock');
  if(!v){ lm.textContent='Entre un mot de passe.'; return; }
  lm.textContent='Vérification…'; btn.disabled=true;
  try{ const r=await fetch(AIW+"/story?check=1&pass="+encodeURIComponent(v));
    if(r.ok){ try{localStorage.setItem('titi_libre_pass',v);}catch(e){} lm.textContent='Déverrouillé ✨'; setTimeout(showLibreGate,700); }
    else lm.textContent='Mot de passe incorrect.';
  }catch(e){ lm.textContent='Problème de connexion, réessaie.'; }
  btn.disabled=false;
}
$('libreUnlock').addEventListener('click',doUnlock);
$('librePass').addEventListener('keydown',e=>{ if(e.key==='Enter') doUnlock(); });

/* ===== LIVRE =====
   book = { id, titre, pages:[texte], sc:[n° de tableau de chaque page] ou null, imgs:[url par page] ou null,
            hero:{emoji}, decor, voix:{sc:{"1":{d,w:[[débuts des mots] par page]}}} ou null, libre:{...} ou null } */
let book=null, cur=0, wordSpans=[], ended=false;
const frame=$('frame'), scene=$('scene');
function sceneOf(i){ return book.sc?book.sc[i]:0; }
function sceneCandidates(){ const out=[];
  if(book.imgs&&book.imgs[cur]){ const u=book.imgs[cur]; out.push(u,u+"&r=2"); }   // histoire inventée : une image par page (2e essai si le 1er échoue)
  if(book.imgs){ for(let k=cur-1;k>=0;k--){ if(book.imgs[k]){ out.push(book.imgs[k]); break; } } }   // sinon on garde celle de la page d'avant
  if(book.id){ const [h,u]=book.id.split('_'), s=sceneOf(cur), k=cur-book.sc.indexOf(s), L="abcdef"[k];
    if(k>0&&book.im&&book.im[s-1]&&book.im[s-1].indexOf(L)>=0) out.push(`assets/scenes/${book.id}_${s}${L}.jpg`);   // image propre à cette page
    out.push(`assets/scenes/${book.id}_${s}.jpg`,`assets/${h}_${u}.png`); }
  if(book.decor) out.push(`assets/decor_${book.decor}.jpg`);
  return out; }
let shownKey='';
function renderScene(){
  const cands=sceneCandidates(), key=cands[0]||''; if(key===shownKey) return; shownKey=key;
  const U=byId(UNIVERS,book.decor)||UNIVERS[4], withEmo=!book.id;          // mode libre : le héros en emoji par-dessus le décor
  (function go(i){
    if(i>=cands.length){ scene.innerHTML=`<svg viewBox="0 0 10 10" preserveAspectRatio="none"><defs><linearGradient id="z" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${U.g[0]}"/><stop offset="1" stop-color="${U.g[1]}"/></linearGradient></defs><rect width="10" height="10" fill="url(#z)"/></svg><div class="hero-emo">${book.hero.emoji||'🧒'}</div>`; return; }

function scenePages(s){ const out=[]; book.sc.forEach((x,i)=>{ if(x===s) out.push(i); }); return out; }

    player.play().then(()=>{ if(my===playToken) tick(); }).catch(()=>{ if(my===playToken) resetPlay(); }); }

      for(let j=0;j<idx.length;j++){ if(pageStart(s,j)<=t+0.02) k=j; else break; }
      if(idx[k]!==cur) renderPage(idx[k]);
      const w=meta.w[k]||[]; let wi=-1; for(let j=0;j<w.length;j++){ if(w[j]<=t+0.05) wi=j; else break; } setWord(wi); }

/* --- A bis. histoire inventée : UNE piste pour toute l'histoire, avec le début de chaque page et de chaque mot --- */
function playPiste(fromPage){

      for(let j=0;j<P.pages.length;j++){ if(P.pages[j]<=t+0.02) k=j; else break; }

/* --- B. lecture en direct page par page (mode libre, ou piste pas encore enregistrée) --- */
function wordTimesFromAlignment(text,al){
  if(!al||!al.character_start_times_seconds) return null;
  const ct=al.character_start_times_seconds, out=[], re=/(\s+)|(\S+)/g; let m;
  while((m=re.exec(text))){ if(m[2]){ const idx=m.index; out.push(ct[idx]!=null?ct[idx]:(out.length?out[out.length-1]:0)); } }
  return out; }

  if(exactStarts && exactStarts.length===wordSpans.length){ starts=exactStarts; lead=0; }
  else { const dur=player.duration; if(!dur||!isFinite(dur)) return;
    const w=wordSpans.map(x=>{ const r=x.raw; const letters=r.replace(/[^\wàâäéèêëïîôöùûüç]/gi,'').length;
      let pause=1; if(/[,;:»)]$/.test(r)) pause+=2; if(/[.!?…]$/.test(r)) pause+=4; return letters+1+pause; });
    const tot=w.reduce((a,b)=>a+b,0)||1; starts=[]; let acc=0; w.forEach(x=>{starts.push(acc/tot*dur);acc+=x;}); lead=0.15; }
  function tick(){ if(my!==playToken||player.paused||player.ended) return; const t=player.currentTime+lead; let idx=0;
    for(let k=0;k<starts.length;k++){ if(starts[k]<=t) idx=k; else break; } setWord(idx); rafId=requestAnimationFrame(tick); }
  if(rafId) cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick); }

  fetch(url).then(async r=>{
    if(my!==playToken) return; if(!r.ok) throw new Error("tts "+r.status);

  }).catch(()=>{ if(my===playToken) speakFallback(text,()=>{ if(my===playToken) advance(i); }); });

const imgBis={};
function gstatus(m){ $('genStatus').textContent=m||''; }
async function generateFree(){
  const hero=$('fHero').value.trim(),lieu=$('fLieu').value.trim(),lecon=$('fLecon').value.trim();
  const age=$('fAge').value; try{localStorage.setItem('titi_age',age);}catch(e){}
  const gb=$('genBar'), gbtn=$('genBtn'), fill=gb.firstElementChild;
  gstatus('La conteuse invente ton histoire…'); gb.hidden=false; gbtn.disabled=true; fill.style.width='3%';
  const t0=Date.now(); const prog=setInterval(()=>{ const e=(Date.now()-t0)/1000; fill.style.width=Math.min(93,93*(1-Math.exp(-e/22))).toFixed(1)+'%'; },200);
  const endBar=()=>{ clearInterval(prog); fill.style.width='100%'; setTimeout(()=>{gb.hidden=true; fill.style.width='0%';},350); gbtn.disabled=false; };
  try{
    const r=await fetch(AIW+"/story?"+new URLSearchParams({hero,lieu,lecon,age,pass:librePass()}).toString());
    if(r.status===403){ try{localStorage.removeItem('titi_libre_pass');}catch(e){} gstatus(''); showLibreGate(); $('lockMsg').textContent='Mot de passe incorrect.'; return; }
    const out=await r.json();
    if(out.plafond){ gstatus("C'est tout pour aujourd'hui : "+out.max+" histoires inventées, la conteuse se repose. À demain !"); return; }
    if(out.refuse){ gstatus("La conteuse ne raconte que des histoires toutes douces pour les petits. Essaie une autre idée !"); return; }
    if(out.error){ gstatus(out.busy?'La conteuse est très demandée en ce moment. Réessaie dans un instant !':'Raté, la conteuse a eu un trou de mémoire. Réessaie.'); return; }
    if(!Array.isArray(out.tableaux)||out.tableaux.length<3) throw new Error('histoire trop courte');
    const it={titre:out.titre||'Mon histoire',decor:out.decor||'foret',emoji:out.emoji||'🧒',tableaux:out.tableaux,sig:out.sig};
    if(it.sig) lancerVoix(it);                              // la voix se prépare pendant que les images se dessinent
    // Les illustrations sont dessinées à la demande : on les attend AVANT d'ouvrir le livre (au plus 100 s), pour ne jamais lire sur une image vide.
    const urls=it.tableaux.flatMap(t=>(t.imgs||[t.img]).filter(Boolean).map(u=>AIW+u)); let faites=0;
    clearInterval(prog); const maj=()=>{ gstatus(`La conteuse dessine les illustrations… ${faites} / ${urls.length}`); fill.style.width=(60+38*faites/Math.max(1,urls.length)).toFixed(0)+'%'; };
    const charge=(u,compte)=>new Promise(res=>{ const im=new Image(); let n=0; im.onload=()=>{ if(n) imgBis[u]=u+"&r=2"; if(compte){ faites++; maj(); } res(); }; im.onerror=()=>{ if(n++<1) im.src=u+"&r=2"; else res(); }; im.src=u; });   // imgBis : l'adresse du 2e essai, pour ne pas faire redessiner l'image à l'affichage
    // D'abord les fiches des personnages (une image de référence chacun) : toutes les pages sont ensuite dessinées d'après elles.
    if(Array.isArray(out.fiches)&&out.fiches.length){ gstatus('La conteuse dessine les personnages…'); fill.style.width='55%';
      await Promise.race([Promise.all(out.fiches.map(u=>charge(AIW+u,false))), new Promise(r=>setTimeout(r,60000))]); }
    maj();
    await Promise.race([Promise.all(urls.map(u=>charge(u,true))), new Promise(r=>setTimeout(r,150000))]);
    gstatus(''); openFree(it,true);
  }catch(e){ gstatus('Raté ('+e.message+'). Réessaie.'); }
  finally{ endBar(); }
}
function openFree(it,fresh){
  const tb=it.tableaux||[]; let pages=[], sc=[], imgs=null;
  if(tb.length){ imgs=[]; tb.forEach((t,k)=>(t.pages||[]).forEach((x,j)=>{ pages.push(x); sc.push(k+1); const u=(t.imgs&&t.imgs[j])||(j===0?t.img:null); imgs.push(u?(imgBis[AIW+u]||AIW+u):null); })); }
  else { pages=(it.pages||[]).slice(); pages.forEach((x,k)=>sc.push(Math.floor(k/3)+1)); }             // histoires gardées avant la refonte
  book={id:'',titre:it.titre||'Mon histoire',pages,sc,im:null,imgs,hero:{emoji:it.emoji||'🧒'},decor:it.decor||'foret',voix:null,piste:null,
        libre:fresh?it:null,src:it};

/* La voix d'une histoire inventée : demandée au worker (texte signé), gardée dans le navigateur pour les réécoutes.
   La demande part dès que le texte est écrit (pendant que les illustrations se dessinent) ; une seule demande par histoire et par voix. */
const voixEnCours={}, voixFiles={}, blobsGardes=new Set();
function chercherVoix(it,n){                                 // -> promesse { w: débuts des mots par page, url } pour le tableau n
  const voix=conteur(), cle=AIW+"/gtts/"+voix+"/"+it.sig+"/"+n;
  if(voixEnCours[cle]) return voixEnCours[cle];
  const p=(async()=>{
    let cache=null, buf=null;
    try{ cache=await caches.open('titi-voix'); const hit=await cache.match(cle); if(hit) buf=await hit.arrayBuffer(); }catch(e){}
    if(!buf){ const r=await fetch(AIW+"/gtts",{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tableaux:it.tableaux.map(t=>t.pages),voix,sig:it.sig,n})});
      if(!r.ok) throw new Error('voix '+r.status);
      buf=await r.arrayBuffer(); try{ if(cache) await cache.put(cle,new Response(buf.slice(0))); }catch(e){} }
    const m=new DataView(buf).getUint32(0,true), meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,m)));
    if(!Array.isArray(meta.mots)||meta.mots.length!==it.tableaux[n-1].pages.length) throw new Error('voix mal calée');
    const url=URL.createObjectURL(new Blob([new Uint8Array(buf,4+m)],{type:'audio/wav'})); blobsGardes.add(url);
    return {w:meta.mots,url};
  })();
  voixEnCours[cle]=p; p.catch(()=>{ delete voixEnCours[cle]; });
  return p;
}
/* Les tableaux sont lus un par un, deux demandes à la fois, dans l'ordre : on peut écouter dès que le premier est prêt
   (une quinzaine de secondes), les suivants arrivent pendant qu'on écoute. -> { n: promesse de la piste, ou null si elle a échoué } */
function lancerVoix(it){
  const cle=conteur()+"/"+it.sig; if(voixFiles[cle]) return voixFiles[cle];
  const N=it.tableaux.length, res={}, P={}; for(let n=1;n<=N;n++) P[n]=new Promise(r=>res[n]=r);
  let next=1; const suivant=()=>{ if(next>N) return; const n=next++;
    chercherVoix(it,n).then(v=>res[n](v),()=>{ delete voixFiles[cle]; res[n](null); }).then(suivant); };
  suivant(); suivant();
  return voixFiles[cle]=P;
}
function preparerVoix(){
  const it=book&&book.src; if(!it||!it.sig||!it.tableaux) return;
  const moi=book, pb=$('playBtn'), P=lancerVoix(it); pb.disabled=true; pb.textContent='La conteuse se prépare…';
  book.voix={dir:null,sc:{}}; book.vp=P;
  Object.keys(P).forEach(n=>P[n].then(v=>{ if(book===moi&&v) book.voix.sc[n]=v; }));
  P[1].then(()=>{ if(book===moi){ pb.disabled=false; setPlay(false); noteVoix(); } });      // pas de voix (quota du jour…) : lecture en direct à la place
}

  a.unshift(Object.assign({id:'s'+Date.now(),ts:Date.now()},book.libre)); savedPut(a);
  const b=$('saveBtn'); b.textContent='Gardée ✓'; b.disabled=true; }
function renderSaved(){ const a=savedAll(), el=$('savedList');
  if(!a.length){ el.innerHTML='<p style="text-align:center;color:var(--ink2);padding:10px">Aucune histoire gardée pour l\'instant. Invente-en une, puis appuie sur « Garder ».</p>'; return; }
  el.innerHTML='';
  a.forEach(it=>{ const row=document.createElement('div'); row.className='saved-row';
    const open=document.createElement('button'); open.className='card saved-open'; open.style.cssText='display:flex;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:12px 14px;text-align:left';
    open.innerHTML=`<span style="font-size:1.8rem">${it.emoji||'📖'}</span><span class="lab" style="padding:0">${esc(it.titre||'Mon histoire')}</span>`;
    open.addEventListener('click',()=>openFree(it,false));
    const del=document.createElement('button'); del.className='arrow saved-del'; del.title='Supprimer'; del.textContent='✕';
    del.addEventListener('click',()=>{ savedPut(savedAll().filter(x=>x.id!==it.id)); renderSaved(); });
    row.appendChild(open); row.appendChild(del); el.appendChild(row); });
}

/* ===== voix =====
   CONTEURS : voix enregistrées (assets/voix/<Nom>/), la 1re par défaut. Si l'histoire n'est pas encore
   enregistrée dans la voix choisie, on prend une autre voix disponible, sinon la lecture en direct. */
const CONTEURS=[["Sulafat","Conteuse chaleureuse"],["Vindemiatrix","Conteuse toute douce"],["Algieba","Conteur"]];
function conteur(){ let v=''; try{v=localStorage.getItem('titi_conteur')||'';}catch(e){} return CONTEURS.some(c=>c[0]===v)?v:CONTEURS[0][0]; }
// lecture en direct provisoire (ElevenLabs gratuit) : voix d'homme « Charlie » si on a choisi le Conteur, sinon « Alice »
function curVoice(){ return conteur()==="Algieba"?"IKne3meq5aSn9XLyUdCD":"Xb7hH8MSUJpSbSDYk0k2"; }
/* Dit clairement quelle voix on va entendre : la voix choisie n'est pas forcément déjà enregistrée pour cette histoire. */
function noteVoix(){ const n=$('voixNote'); if(!n||!book){ return; } const nom=v=>(CONTEURS.find(c=>c[0]===v)||[0,v])[1];
  if(!book.id){ n.textContent=(book.piste||(book.voix&&book.voix.sc[1]))?'':'La voix de conteuse n\'est pas disponible pour l\'instant : lecture provisoire.'; return; }
  const d=book.voix&&(book.voix.v||book.voix.dir), complet=d&&book.sc.every(x=>book.voix.sc[x]);
  n.textContent = complet&&d===conteur() ? '' :
    complet ? `« ${nom(conteur())} » n'est pas encore enregistrée pour cette histoire : tu entendras « ${nom(d)} ».` :
    `Cette histoire n'est pas encore enregistrée : lecture provisoire, la belle voix arrive dans quelques jours.`; }
(function initVoice(){ const sel=$('voiceSel');
  CONTEURS.forEach(([id,n])=>{ const o=document.createElement('option'); o.value=id; o.textContent=n; sel.appendChild(o); });
  sel.value=conteur();
  sel.addEventListener('change',async()=>{ try{localStorage.setItem('titi_conteur',sel.value);}catch(e){}
    stopAudio(); resetPlay(); if(!book) return;
    if(book.id){ book.voix=null; const pb=$('playBtn'); pb.disabled=true; await loadVoix(book.id); pb.disabled=false; }
    else { book.piste=null; book.voix=null; preparerVoix(); } });
})();

renderHome();
goto('s0');
</script>
