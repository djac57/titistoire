<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Titistoire — Mon Petit Conteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font-d:'Fredoka',ui-rounded,system-ui,sans-serif;
    --font-t:'Nunito',ui-rounded,system-ui,sans-serif;
    --ink:#46345f; --ink2:#7a6a95; --paper:#fffaf2;
    --accent:#ff8fab; --accent2:#9b8cff; --go:#43c79a; --go-d:#36a983;
    --hi:#ffd86b; --hi-ink:#5a4100;
    --shadow:0 14px 34px rgba(120,95,165,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{ margin:0; color:var(--ink); font-family:var(--font-t); font-weight:600;
    background:linear-gradient(170deg,#fff3e3 0%,#ffe0ee 45%,#e7e4ff 100%); background-attachment:fixed;
    min-height:100%; position:relative; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center; padding:16px 16px 44px; }
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-2;pointer-events:none;}
  body::before{width:340px;height:340px;background:#ffd0e4;top:-90px;left:-70px;}
  body::after{width:380px;height:380px;background:#d4ebff;bottom:-110px;right:-80px;}
  /* étoiles */
  .stars{position:fixed;inset:0;z-index:-1;pointer-events:none;}
  .stars b{position:absolute;color:#fff;opacity:.8;font-size:12px;animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.1)}}
  h1,h2,.q,.btn,.lab,.title,.counter,.back{font-family:var(--font-d);}
  header{text-align:center;margin:4px 0 12px;}
  h1{font-size:clamp(1.7rem,6.5vw,2.5rem);margin:.1em 0;color:#5a3c7a;text-shadow:0 2px 0 #fff;letter-spacing:.5px;}
  .sub{color:var(--ink2);margin:0;font-size:clamp(.9rem,3.4vw,1.1rem);}
  .wrap{width:100%;max-width:760px;}
  .screen{display:none;animation:pop .4s ease;}
  .screen.show{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .q{text-align:center;font-size:clamp(1.3rem,5vw,1.8rem);margin:2px 0 18px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:#fff;border:none;border-radius:24px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;
    transition:transform .14s,box-shadow .14s;font-family:inherit;color:inherit;padding:0;}
  .card:active{transform:scale(.95);}
  .card:hover{transform:translateY(-5px);box-shadow:0 20px 38px rgba(120,95,165,.26);}
  .card .thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#f0ecf8;}
  .card .emoji{font-size:clamp(2.6rem,12vw,4rem);padding:18px 0 6px;}
  .card .lab{display:block;padding:10px 6px 14px;font-size:clamp(1.05rem,4.2vw,1.3rem);font-weight:700;}
  .back{display:inline-flex;align-items:center;gap:6px;background:#fff;border:none;border-radius:999px;padding:9px 16px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;margin-bottom:12px;}

  /* mode libre */
  .freeform{display:flex;flex-direction:column;gap:14px;background:#ffffffcc;border-radius:24px;padding:18px;box-shadow:var(--shadow);}
  .freeform label{display:flex;flex-direction:column;gap:6px;font-weight:700;}
  .freeform input{font-family:inherit;font-size:1.05rem;padding:12px 14px;border-radius:14px;border:2px solid #ecdff5;}
  .genstatus{text-align:center;color:var(--ink2);min-height:1.3em;font-weight:700;}

  /* LIVRE */
  .book{background:var(--paper);border-radius:28px;box-shadow:var(--shadow);padding:16px 16px 20px;border:1px solid #f0e6d6;position:relative;}
  .title{text-align:center;font-size:clamp(1.2rem,4.8vw,1.65rem);margin:4px 0 12px;color:#5a3c7a;}
  .frame{position:relative;border-radius:20px;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 26px rgba(90,60,120,.22);aspect-ratio:16/10;background:#eef;}
  .frame.turning{animation:flip .6s ease;}
  @keyframes flip{0%{opacity:1;transform:translateX(0)}45%{opacity:0;transform:translateX(-22px) rotate(-1deg)}55%{opacity:0;transform:translateX(22px) rotate(1deg)}100%{opacity:1;transform:none}}
  .frame img,.frame svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .hero-emo{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:clamp(3rem,16vw,5rem);}
  .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff8;font-family:var(--font-d);color:var(--ink2);font-size:1rem;}
  .loading.on{display:flex;}
  .ptext{padding:18px 14px 6px;font-size:clamp(1.3rem,5vw,1.75rem);line-height:1.8;text-align:center;min-height:2.6em;}
  .ptext.moral{font-style:italic;color:var(--accent2);}
  .word{padding:1px 4px;border-radius:9px;transition:background .1s,color .1s;}
  .word.on{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 4px var(--hi);font-weight:800;}

  .pagenav{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 2px;}
  .arrow{border:none;background:#fff;border-radius:50%;width:52px;height:52px;font-size:1.5rem;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);transition:transform .12s;}
  .arrow:active{transform:scale(.9);} .arrow:disabled{opacity:.3;}
  .counter{font-weight:700;color:var(--ink2);min-width:84px;text-align:center;}
  .controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;}
  .btn{border:none;border-radius:999px;padding:14px 22px;font-size:1.1rem;font-weight:700;font-family:var(--font-d);color:#fff;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;transition:transform .12s;}
  .btn:active{transform:scale(.93);}
  .btn.play{background:var(--go);font-size:1.3rem;padding:16px 30px;}
  .btn.play.pause{background:var(--accent2);}
  .btn.sec{background:#fff;color:var(--ink);} .btn.home{background:var(--accent);}
  .settings{display:flex;gap:14px 20px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:16px;background:#ffffffaa;border-radius:18px;padding:10px 14px;color:var(--ink2);font-weight:700;}
  .settings input[type=range]{accent-color:var(--accent2);}
  .hint{text-align:center;color:var(--ink2);font-size:.84rem;margin-top:12px;}
  .saved-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .saved-del{width:46px;height:46px;font-size:1.05rem;flex:0 0 auto;}
  .saved-open{flex:1;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<header>
  <h1>✨ Titistoire ✨</h1>
  <p class="sub">Choisis, écoute une belle voix, et tourne les pages</p>
</header>

<div class="wrap">
  <!-- mode -->
  <section class="screen" id="s0">
    <h2 class="q">On invente comment&nbsp;? 🪄</h2>
    <div class="grid">
      <button class="card" id="modeGuided"><div class="emoji">🎴</div><span class="lab">Avec des images</span></button>
      <button class="card" id="modeFree"><div class="emoji">✏️</div><span class="lab">Je raconte</span></button>
    </div>
    <button class="card" id="modeSaved" style="width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px"><span style="font-size:2rem">📚</span><span class="lab" style="padding:0">Mes histoires</span></button>
  </section>

  <section class="screen" id="sSaved">
    <button class="back" data-go="s0">⬅️ Retour</button>
    <h2 class="q">Mes histoires 📚</h2>
    <div id="savedList"></div>
  </section>

  <section class="screen" id="s1"><button class="back" data-go="s0">⬅️ Retour</button><h2 class="q">Qui est le héros&nbsp;? 🦸</h2><div class="grid" id="grid1"></div></section>
  <section class="screen" id="s2"><button class="back" data-go="s1">⬅️ Retour</button><h2 class="q">Où ça se passe&nbsp;? 🗺️</h2><div class="grid" id="grid2"></div></section>
  <section class="screen" id="s3"><button class="back" data-go="s2">⬅️ Retour</button><h2 class="q">Quelle belle leçon&nbsp;? 🌟</h2><div class="grid" id="grid3"></div></section>

  <section class="screen" id="sFree">
    <button class="back" data-go="s0">⬅️ Retour</button>
    <h2 class="q">Raconte ton histoire ✏️</h2>
    <div class="freeform">
      <label>🦸 Le héros<input id="fHero" placeholder="ex : un petit lapin bleu nommé Pompon"></label>
      <label>🗺️ Le lieu<input id="fLieu" placeholder="ex : une forêt enchantée sous la pluie"></label>
      <label>🌟 La leçon<input id="fLecon" placeholder="ex : il faut être patient"></label>
      <button class="btn play" id="genBtn" style="align-self:center">✨ Invente l'histoire</button>
      <div id="genStatus" class="genstatus"></div>
    </div>
  </section>

  <!-- livre -->
  <section class="screen" id="s4">
    <button class="back" id="homeBtn2">🏠 Nouvelle histoire</button>
    <div class="book">
      <h2 class="title" id="title"></h2>
      <div class="frame" id="frame">
        <div class="scene" id="scene"></div>
        <div class="loading" id="loading">🎨✨</div>
      </div>
      <div class="ptext" id="ptext"></div>
      <div class="pagenav">
        <button class="arrow" id="prevBtn">◀</button>
        <span class="counter" id="counter"></span>
        <button class="arrow" id="nextBtn">▶</button>
      </div>
      <div class="controls">
        <button class="btn play" id="playBtn">▶️ Lire</button>
        <button class="btn sec" id="replayBtn">🔁 Recommencer</button>
        <button class="btn sec" id="saveBtn" style="display:none">💾 Garder</button>
        <button class="btn home" id="homeBtn">🏠 Nouvelle</button>
      </div>
      <div class="settings">
        🐢 <input type="range" id="rate" min="0.8" max="1.15" step="0.05" value="1"> 🐇
      </div>
      <p class="hint" id="hint">Belle voix via le conteur magique 🎙️</p>
    </div>
  </section>
</div>

<script>
/* ===== Worker IA (voix + images + histoires) ===== */
const AIW = "https://titistoire-ai.djac-gene.workers.dev";
/* style ligne-claire pour les images du mode libre (générées en direct, en cache sur le worker) */
const LIBRE_STYLE = "Flat 2D vector illustration in the Belgian 'ligne claire' comic style of Tintin and Herge: bold uniform black outlines, flat pastel colours, no gradients, no shading. Charming clean vintage children's picture-book. A cute ";
function seedFrom(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h%90000+1000; }

/* ===== étoiles déco ===== */
(function(){ const s=document.getElementById('stars'); let h='';
  for(let i=0;i<22;i++){ h+=`<b style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*3).toFixed(1)}s">✦</b>`; }
  s.innerHTML=h; })();

/* ===== DONNÉES ===== */
const PERSOS=[
  {id:'filou',nom:'Filou',f:false,desc:"un petit renard roux malicieux"},
  {id:'nestor',nom:'Nestor',f:false,desc:"un ourson brun tout doux"},
  {id:'rosie',nom:'Rosie',f:true,desc:"une petite lapine blanche"},
  {id:'plume',nom:'Plume',f:true,desc:"une petite chouette beige"},
];
const UNIVERS=[
  {id:'pirates',nom:'Les pirates',emoji:'🏴‍☠️',phrase:"sur un bateau de pirates"},
  {id:'dino',nom:'Les dinosaures',emoji:'🦕',phrase:"au temps des dinosaures"},
  {id:'chevaliers',nom:'Les chevaliers',emoji:'🛡️',phrase:"au temps des chevaliers"},
  {id:'espace',nom:'Les astronautes',emoji:'🚀',phrase:"dans l'espace, parmi les étoiles"},
  {id:'foret',nom:'La forêt',emoji:'🌲',phrase:"dans la grande forêt"},
  {id:'ocean',nom:"L'océan",emoji:'🌊',phrase:"tout au fond de l'océan"},
];
const VALEURS=[
  {id:'partage',nom:'Le partage',emoji:'🤝'},
  {id:'courage',nom:'Le courage',emoji:'🦁'},
  {id:'amitie',nom:"L'amitié",emoji:'🫂'},
  {id:'verite',nom:'La vérité',emoji:'💛'},
];

function buildStory(p,u,v){
  const H=p.nom,il=p.f?"elle":"il",Il=p.f?"Elle":"Il",seul=p.f?"seule":"seul",cont=p.f?"contente":"content",place=u.phrase;
  if(v.id==='partage') return [
    `Il était une fois ${H}, un petit ami tout doux qui vivait ${place}.`,
    `Ce matin-là, le soleil brillait, et ${H} partit se promener en chantonnant.`,
    `Au détour du chemin, ${il} découvrit un grand panier rempli de bonnes choses à manger.`,
    `« Oh ! Des fruits, des gâteaux… et tout ça pour moi ! » se réjouit-${il}.`,
    `${Il} serra le panier bien fort, sans vouloir en donner une miette.`,
    `Mais un peu plus loin, ${H} vit des amis au ventre tout vide qui soupiraient.`,
    `${Il} s'arrêta net. Dans sa tête, une petite voix murmura : « Et si tu partageais ? »`,
    `Alors ${H} prit une grande respiration et ouvrit tout grand le panier.`,
    `${Il} offrit un bon fruit à chacun, et bientôt tout le monde croquait en riant.`,
    `Entouré${p.f?'e':''} de ses amis joyeux, ${H} se sentit ${cont} comme jamais.`,
    `La morale de l'histoire : quand on partage, la joie devient deux fois plus grande.`,
  ];
  if(v.id==='courage') return [
    `Il était une fois ${H}, un petit ami curieux qui vivait ${place}.`,
    `Un beau jour, ${H} explorait joyeusement les alentours.`,
    `Tout à coup, ${il} entendit un tout petit cri : « Au secours ! »`,
    `${Il} tendit l'oreille et suivit le son, à pas prudents.`,
    `Là, ${H} trouva un minuscule ami coincé, qui tremblait de peur.`,
    `Le cœur de ${H} se mit à battre très fort : boum, boum, boum.`,
    `${Il} avait un peu peur… mais ${il} prit une grande respiration pour se donner du courage.`,
    `Doucement, pas à pas, ${H} s'approcha pour aider.`,
    `Avec délicatesse, ${il} réussit à libérer le petit ami prisonnier.`,
    `« Merci, merci ! » dit le petit ami en serrant ${H} dans ses bras.`,
    `La morale de l'histoire : le courage, c'est oser aider même quand on a un peu peur.`,
  ];
  if(v.id==='amitie') return [
    `Il était une fois ${H}, un petit ami au grand cœur qui vivait ${place}.`,
    `Ce matin-là, ${H} se sentait un peu ${seul}, et rêvait d'un compagnon de jeu.`,
    `En se promenant, ${il} entendit quelqu'un qui pleurait tout doucement.`,
    `${Il} s'approcha gentiment et demanda : « Qu'est-ce qui ne va pas ? »`,
    `Puis, avec un grand sourire, ${H} proposa : « Veux-tu jouer avec moi ? »`,
    `D'abord timides, les deux amis commencèrent à jouer ensemble.`,
    `Ils inventèrent mille jeux rigolos et rirent de bon cœur.`,
    `Fatigués et heureux, ils partagèrent un petit goûter, côte à côte.`,
    `Quand le soleil se coucha, ils étaient devenus de vrais amis.`,
    `${H} rentra chez ${il==='elle'?'elle':'lui'}, le cœur tout rempli de bonheur.`,
    `La morale de l'histoire : un ami, c'est le plus joli des trésors.`,
  ];
  return [
    `Il était une fois ${H}, un petit ami espiègle qui vivait ${place}.`,
    `Un jour, en jouant, ${H} s'amusait comme un fou.`,
    `Mais patatras ! Sans le vouloir, ${il} cassa un très joli objet.`,
    `${H} regarda les morceaux par terre, tout surpris${p.f?'e':''}.`,
    `« Oh non… si je le dis, on va me gronder », pensa-t-${il}.`,
    `${Il} eut envie de se cacher et de ne rien dire du tout.`,
    `Mais au fond de son cœur, quelque chose le chatouillait sans arrêt.`,
    `Alors ${H} rassembla tout son courage et alla voir un grand ami.`,
    `${Il} raconta la vérité : « C'est moi… je suis vraiment désolé${p.f?'e':''}. »`,
    `Au lieu de se fâcher, le grand ami le serra tendrement dans ses bras.`,
    `La morale de l'histoire : dire la vérité rend le cœur tout léger.`,
  ];
}

/* ===== SCÈNES (SVG de secours) ===== */
function sceneSVG(id){
  if(id==='chevaliers') id='chateau';
  const g={foret:['#bfe9ff','#eafaf0'],ocean:['#8fd3ff','#1f6bb0'],espace:['#2a1b5e','#5b2a82'],chateau:['#ffd1ec','#b79cff'],pirates:['#ffd59e','#6fb9e0'],dino:['#cdefff','#dff3c6']}[id]||['#bfe9ff','#eafaf0'];
  return `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="z" x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="${g[0]}"/><stop offset=1 stop-color="${g[1]}"/></linearGradient></defs><rect width=400 height=250 fill="url(#z)"/></svg>`;
}

/* ===== NAV ===== */
function goto(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id)); window.scrollTo({top:0,behavior:'smooth'}); stopAudio(); }
document.querySelectorAll('.back[data-go]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.go)));

function heroThumb(p){ return `assets/${p.id}_foret.png`; }
function univThumb(u){ return `assets/filou_${u.id}.png`; }
function fillGrid(id,items,onPick,thumb){ const gEl=document.getElementById(id); gEl.innerHTML='';
  items.forEach(it=>{ const b=document.createElement('button'); b.className='card';
    if(thumb){ b.innerHTML=`<img class="thumb" src="${thumb(it)}" alt="" onerror="this.style.display='none'"><span class="lab">${it.nom}</span>`; }
    else { b.innerHTML=`<div class="emoji">${it.emoji}</div><span class="lab">${it.nom}</span>`; }
    b.addEventListener('click',()=>onPick(it)); gEl.appendChild(b); }); }

const choice={perso:null,univers:null,valeur:null};
document.getElementById('modeGuided').addEventListener('click',()=>goto('s1'));
document.getElementById('modeFree').addEventListener('click',()=>goto('sFree'));
document.getElementById('modeSaved').addEventListener('click',()=>{ renderSaved(); goto('sSaved'); });
fillGrid('grid1',PERSOS, it=>{choice.perso=it;goto('s2');}, heroThumb);
fillGrid('grid2',UNIVERS,it=>{choice.univers=it;goto('s3');}, univThumb);
fillGrid('grid3',VALEURS,it=>{choice.valeur=it;openStory();}, null);

/* ===== LIVRE ===== */
let pages=[],cur=0,storyPlain="",wordSpans=[];
const frame=document.getElementById('frame'), scene=document.getElementById('scene');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sceneCandidates(){
  const h=choice.perso&&choice.perso.id, u=choice.univers&&choice.univers.id, v=choice.valeur&&choice.valeur.id, out=[];
  if(choice.sceneImgs && choice.sceneImgs[cur]) out.push(choice.sceneImgs[cur]);        // mode libre : une image par page
  if(h&&u){
    if(cur>0 && v) out.push(`assets/scenes/${h}_${u}_${v}_p${cur+1}.png`);              // scène guidée de cette page
    out.push(`assets/${h}_${u}.png`);                                                    // ambiance (repli)
  }
  if(choice.sceneImg) out.push(choice.sceneImg);                                         // ancienne image unique
  return out;
}
function tryImg(list,i){ if(i>=list.length) return; const img=new Image(); img.className='scene-img';
  img.onload=()=>{ scene.querySelectorAll('svg,.fallback,.scene-img').forEach(e=>e.remove()); scene.appendChild(img); };
  img.onerror=()=>tryImg(list,i+1); img.src=list[i]; }
function renderScene(){
  const uid=(choice.univers&&choice.univers.id)||'';
  scene.innerHTML = sceneSVG(uid)+`<div class="hero-emo fallback">${(choice.perso&&choice.perso.emoji)||'🧒'}</div>`;
  tryImg(sceneCandidates(),0);
  if(choice.sceneImgs && choice.sceneImgs[cur+1]){ const pf=new Image(); pf.src=choice.sceneImgs[cur+1]; } // pré-charge la page suivante (mode libre)
}
function renderWords(text){ storyPlain=text; wordSpans=[]; let html=''; const re=/(\s+)|(\S+)/g,el=document.getElementById('ptext'); let m;
  while((m=re.exec(text))){ if(m[1])html+=' '; else { wordSpans.push({raw:m[2]}); html+=`<span class="word" data-i="${wordSpans.length-1}">${esc(m[2])}</span>`; } }
  el.className='ptext'+(cur===pages.length-1?' moral':''); el.innerHTML=html;
  wordSpans.forEach((w,i)=>w.el=el.querySelector('.word[data-i="'+i+'"]')); }
function renderPage(i){ cur=i; renderScene(); renderWords(pages[i]); updateNav(); }
function updateNav(){ document.getElementById('counter').textContent=`Page ${cur+1} / ${pages.length}`; document.getElementById('prevBtn').disabled=cur<=0; document.getElementById('nextBtn').disabled=cur>=pages.length-1; }
function turnTo(i,cb){ if(i<0||i>=pages.length){cb&&cb();return;} frame.classList.remove('turning'); void frame.offsetWidth; frame.classList.add('turning');
  setTimeout(()=>{ renderPage(i); },300); setTimeout(()=>{ frame.classList.remove('turning'); cb&&cb(); },600); }
function clearHi(){ wordSpans.forEach(w=>w.el&&w.el.classList.remove('on')); }
function setWord(i){ clearHi(); if(i>=0&&i<wordSpans.length&&wordSpans[i].el) wordSpans[i].el.classList.add('on'); }

function showBook(title){ document.getElementById('title').textContent=title||''; cur=0; renderPage(0); resetPlay();
  const sb=document.getElementById('saveBtn'); sb.style.display=choice.freeStory?'inline-flex':'none'; sb.disabled=false; sb.textContent='💾 Garder';
  goto('s4'); }
function openStory(){ pages=buildStory(choice.perso,choice.univers,choice.valeur); choice.sceneImg=null; choice.sceneImgs=null; choice.freeStory=null; showBook(`L'histoire de ${choice.perso.nom}`); }

/* ===== VOIX (worker TTS) + surlignage synchronisé ===== */
let auto=false, curAudio=null, rafId=0, usingFallback=false;
function rate(){ return parseFloat(document.getElementById('rate').value)||1; }
function setPlay(on){ const b=document.getElementById('playBtn'); b.textContent=on?'⏸️ Pause':'▶️ Lire'; b.classList.toggle('pause',on); }
function resetPlay(){ auto=false; setPlay(false); }
function stopAudio(){
  if(curAudio){ try{ curAudio.onended=curAudio.onerror=curAudio.oncanplay=curAudio.onloadedmetadata=null; curAudio.pause(); curAudio.removeAttribute('src'); curAudio.load(); }catch(e){} curAudio=null; }
  if(rafId) cancelAnimationFrame(rafId); rafId=0;
  try{ speechSynthesis.cancel(); }catch(e){} usingFallback=false;
  document.getElementById('loading').classList.remove('on'); }
function loader(on){ document.getElementById('loading').classList.toggle('on',on); }

function highlightSync(audio){
  const dur=audio.duration; if(!dur||!isFinite(dur)||!wordSpans.length) return;
  const w=wordSpans.map(x=>x.raw.replace(/[^\wàâäéèêëïîôöùûüç]/gi,'').length+2);
  const tot=w.reduce((a,b)=>a+b,0); const starts=[]; let acc=0; w.forEach(x=>{starts.push(acc/tot*dur);acc+=x;});
  function tick(){ if(!curAudio||audio.paused||audio.ended) return; const t=audio.currentTime; let idx=0;
    for(let k=0;k<starts.length;k++){ if(starts[k]<=t) idx=k; else break; } setWord(idx); rafId=requestAnimationFrame(tick); }
  rafId=requestAnimationFrame(tick);
}
function speakFallback(text,onend){ usingFallback=true; try{ const u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=rate()*0.95;
  u.onboundary=e=>{ if(typeof e.charIndex==='number'){ let idx=0,acc=0; for(let k=0;k<wordSpans.length;k++){ if(acc<=e.charIndex) idx=k; acc+=wordSpans[k].raw.length+1; } setWord(idx);} };
  u.onend=()=>{clearHi();onend&&onend();}; speechSynthesis.cancel(); speechSynthesis.speak(u);
}catch(e){ onend&&onend(); } }

function readPage(i){
  cur=i; stopAudio(); loader(true);
  const text=pages[i];
  const url=AIW+"/tts?lang=fr&t="+encodeURIComponent(text);
  const a=new Audio(); curAudio=a; a.src=url;
  a.playbackRate=rate();
  a.onloadedmetadata=()=>{ loader(false); highlightSync(a); };
  a.oncanplay=()=>loader(false);
  a.onended=()=>{ clearHi(); if(auto){ if(i+1<pages.length) turnTo(i+1,()=>readPage(i+1)); else resetPlay(); } };
  a.onerror=()=>{ loader(false); curAudio=null; speakFallback(text,()=>{ if(auto){ if(i+1<pages.length) turnTo(i+1,()=>readPage(i+1)); else resetPlay(); } }); };
  a.play().catch(()=>{ a.onerror(); });
}
function startReading(){ auto=true; setPlay(true); readPage(cur); }
document.getElementById('playBtn').addEventListener('click',()=>{
  if(curAudio){ if(curAudio.paused){ curAudio.play(); setPlay(true);} else { curAudio.pause(); setPlay(false);} return; }
  if(speechSynthesis.speaking){ if(speechSynthesis.paused){speechSynthesis.resume();setPlay(true);}else{speechSynthesis.pause();setPlay(false);} return; }
  startReading();
});
document.getElementById('replayBtn').addEventListener('click',()=>{ stopAudio(); cur=0; renderPage(0); startReading(); });
function home(){ stopAudio(); resetPlay(); choice.perso=choice.univers=choice.valeur=choice.sceneImg=choice.sceneImgs=choice.freeStory=null; goto('s0'); }
document.getElementById('saveBtn').addEventListener('click',saveCurrent);
document.getElementById('homeBtn').addEventListener('click',home);
document.getElementById('homeBtn2').addEventListener('click',home);
document.getElementById('prevBtn').addEventListener('click',()=>{ auto=false;setPlay(false);stopAudio(); turnTo(cur-1,()=>readPage(cur)); });
document.getElementById('nextBtn').addEventListener('click',()=>{ auto=false;setPlay(false);stopAudio(); turnTo(cur+1,()=>readPage(cur)); });

/* ===== MODE LIBRE (via worker, sans clé navigateur) ===== */
function gstatus(m){ document.getElementById('genStatus').textContent=m||''; }
function libreImgs(hero,lieu,pages){
  const seed=seedFrom(hero||lieu||'conte'), desc=(hero||'little animal')+(lieu?(' '+lieu):'');
  return pages.map(txt=> AIW+"/img?"+new URLSearchParams({seed:String(seed),p:LIBRE_STYLE+desc+". Scene of this page: "+txt+" No text, no letters."}).toString());
}
async function generateFree(){
  const hero=document.getElementById('fHero').value.trim(),lieu=document.getElementById('fLieu').value.trim(),lecon=document.getElementById('fLecon').value.trim();
  gstatus('✨ La conteuse invente…');
  try{
    const r=await fetch(AIW+"/story?"+new URLSearchParams({hero,lieu,lecon}).toString());
    const out=await r.json();
    if(out.error) throw new Error(out.error);
    pages=(out.pages||[]).map(x=>String(x).trim()).filter(Boolean); if(pages.length<3) throw new Error('histoire trop courte');
    const emoji=(out.emoji&&[...out.emoji][0])||'🧒', decor=out.decor||'foret', titre=out.titre||'Mon histoire';
    choice.perso={nom:hero||'le héros',emoji,id:''};
    choice.univers={id:decor,emoji:'✨'}; choice.valeur={emoji:'🌟',id:''};
    choice.sceneImg=null; choice.sceneImgs=libreImgs(hero,lieu,pages);
    choice.freeStory={titre,decor,emoji,hero:hero||'le héros',lieu,lecon,pages:pages.slice(),sceneImgs:choice.sceneImgs.slice()};
    gstatus(''); showBook(titre);
  }catch(e){ gstatus('😅 Raté ('+e.message+'). Réessaie.'); }
}
document.getElementById('genBtn').addEventListener('click',generateFree);

/* ===== BIBLIOTHÈQUE « Mes histoires » (local) ===== */
function savedAll(){ try{return JSON.parse(localStorage.getItem('titi_saved')||'[]');}catch(e){return [];} }
function savedPut(a){ try{localStorage.setItem('titi_saved',JSON.stringify(a));}catch(e){} }
function saveCurrent(){ if(!choice.freeStory) return; const a=savedAll();
  a.unshift(Object.assign({id:'s'+Date.now(),ts:Date.now()},choice.freeStory)); savedPut(a);
  const b=document.getElementById('saveBtn'); b.textContent='✅ Gardée !'; b.disabled=true; }
function openSaved(it){
  pages=(it.pages||[]).slice();
  choice.perso={nom:it.hero||'le héros',emoji:it.emoji||'🧒',id:''};
  choice.univers={id:it.decor||'foret',emoji:'✨'}; choice.valeur={emoji:'🌟',id:''};
  choice.sceneImg=null; choice.sceneImgs=(it.sceneImgs&&it.sceneImgs.length)?it.sceneImgs.slice():null; choice.freeStory=null;
  showBook(it.titre||'Mon histoire');
}
function renderSaved(){ const a=savedAll(), el=document.getElementById('savedList');
  if(!a.length){ el.innerHTML='<p style="text-align:center;color:var(--ink2);padding:10px">Aucune histoire gardée. Invente-en une avec « ✏️ Je raconte », puis appuie sur 💾 Garder.</p>'; return; }
  el.innerHTML='';
  a.forEach(it=>{ const row=document.createElement('div'); row.className='saved-row';
    const open=document.createElement('button'); open.className='card saved-open'; open.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left';
    open.innerHTML=`<span style="font-size:1.8rem">${it.emoji||'📖'}</span><span class="lab" style="padding:0">${esc(it.titre||'Mon histoire')}</span>`;
    open.addEventListener('click',()=>openSaved(it));
    const del=document.createElement('button'); del.className='arrow saved-del'; del.title='Supprimer'; del.textContent='🗑️';
    del.addEventListener('click',()=>{ savedPut(savedAll().filter(x=>x.id!==it.id)); renderSaved(); });
    row.appendChild(open); row.appendChild(del); el.appendChild(row); });
}

goto('s0');
</script>
