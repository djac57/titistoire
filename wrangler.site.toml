# Le SITE (pages, images, voix) servi par Cloudflare sur titistoire.fr : fichiers statiques, sans code.
# Déployé par le projet Cloudflare « titistoire » (Workers Builds) avec :  npx wrangler deploy -c wrangler.site.toml
# Le worker d'IA (histoires à la demande) reste décrit par wrangler.toml et déployé par .github/workflows/deploy-worker.yml.
name = "titistoire"
compatibility_date = "2025-04-01"
main = "site/range.js"
workers_dev = true
# Le domaine est rattaché ici pour qu'il le reste à chaque déploiement.
routes = [
  { pattern = "titistoire.fr", custom_domain = true },
  { pattern = "www.titistoire.fr", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/assets/voix/*"]      # le reste est servi directement, sans exécuter de code
